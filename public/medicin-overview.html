<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="js/medicin-overview.js" defer></script>
    <script src="js/script.js" defer></script>
    <title>Medicinoversigt</title>
  </head>
  <body>
    <!-- Navigationsmenu (Faith) -->
    <header>
      <nav>
        <a href="reminder.html" class="logo">
          <img src="logo.svg" alt="Logo" />
          <span>Medicinpåmindelse</span>
        </a>

        <button class="toggle-btn">
          <img src="b-menu.svg" alt="Menu" />
        </button>

        <div class="nav-pages">
          <a href="reminder.html">Påmindelser</a>
          <a href="calendar.html">Kalender</a>
          <a href="medicin-overview.html" class="active">Medicinoversigt</a>

          <!-- Brugernavn + Logudknap (Safiya) -->
          <span id="brugernavn-visning"></span>
          <button id="logoutButton" type="button">Log ud</button>
        </div>
      </nav>
    </header>

    <main>
      <h1>Medicinoversigt</h1>
      <p>Her kan du oprette medicin og se status over din medicin.</p>
      <div class="medicin-layout">
        <section>
          <h2>Opret medicin</h2>
          <form id="opret-medicin" class="medicin-form">
            <label for="medicin">Medicin</label>
            <input id="medicin" type="text" placeholder="Fx Panodil" required />

            <label for="dosis">Dosis</label>
            <input id="dosis" type="text" placeholder="Fx 500 mg" required />

            <label for="tidspunkt">Tidspunkt</label>
            <input id="tidspunkt" type="time" required />

            <label for="interval">Hvor ofte</label>
            <select id="interval" required>
              <option value="1">Hver dag</option>
              <option value="2">Hver anden dag</option>
              <option value="7">Én gang om ugen</option>
            </select>

            <button type="submit" class="medicin-button">Gem</button>
            <p id="ok" hidden>Gemt.</p>
            <p id="fejl" hidden>Kunne ikke gemme. Tjek felterne.</p>
          </form>
        </section>

        <section>
          <h2>Min medicin</h2>
          <table>
            <thead>
              <tr>
                <th>Medicin</th>
                <th>Dosis</th>
                <th>Tidspunkt</th>
                <th>Hvor ofte</th>
              </tr>
            </thead>
            <tbody id="medicin-liste"></tbody>
          </table>
        </section>
      </div>
    </main>
  </body>
</html>
