
<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Medicinpåmindelser</title>

    <!-- Forbinder HTML med CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Forbinder HTML med JavaScript -->
    <script src="js/login.js" defer></script>
  </head>

  <body>
    <main class="forside">

      <!-- Blå bjælke med logo og navn -->
      <header class="topbar">
        <img src="logo.svg" alt="Logo" class="logo" />
        <h1>Medicinpåmindelser</h1>
      </header>

      <!-- Velkomsttekst -->
      <section class="velkommen">
        <h2>Velkommen</h2>

        <p>
          Med din sundhedsplatform kan du holde styr på din medicin
          og få et bedre overblik over din hverdag.
        </p>
      </section>

      <!-- Login -->
      <section class="login">
        <h2>Din adgang</h2>

        <form id="login-form">

          <!-- Brugernavn -->
          
          <div class="input-felt">
  <label for="brugernavn">CPR-nummer</label>
  <input
    type="text"
    id="brugernavn"
    name="brugernavn"
    placeholder="Indtast dit CPR-nummer"
    pattern="[0-9]{10}"
    maxlength="10"
    inputmode="numeric"
    required
  />
</div>

          <!-- Adgangskode -->
          <div class="input-felt">
            <label for="password">Adgangskode</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Indtast din adgangskode"
              autocomplete="current-password"
              required
            />
          </div>

          <!-- Login-knap -->
          <button type="submit">Log ind</button>

          <!-- Fejlbesked ved forkert login -->
          <p id="login-fejl" role="alert"></p>

        </form>
      </section>

    </main>
  </body>
</html>
