<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <link rel="stylesheet" href="style.css" />
   <link rel="stylesheet" href="faith.css" />
     <script src="js/medicin-overview.js" defer></script>

    <title>Påmindelser</title>
  </head>
  <body>
   <header>
      <nav>
        <a href="reminder.html" class="logo">
          <img src="logo.svg" alt="Logo" />
          <span>Medicinpåmindelse</span>
        </a>

        <button class="toggle-btn">
          <img src="b-menu.svg" alt="Menu" />
        </button>

        <div class="nav-pages">
          <a href="reminder.html">Påmindelser</a>
          <a href="calendar.html">Kalender</a>
          <a href="medicin-overview.html" class="active">Medicinoversigt</a>
        </div>
      </nav>
    </header>

    <main class="paamindelser">
      <section>
        <h1>Påmindelser</h1>
        <p>Her kan du se dine påmindelser for at tage medicin.</p>
         <p class="progress" id="progress"></p>

           <ol class="timeline">

  <li class="reminder" data-medicin-id="1">
    <span class="dot" aria-hidden="true"></span>
    <p class="time">08:00</p>
    <h2>Primcillin</h2>

    <div class="checkmark" hidden>✓</div>

    <div class="actions">
      <button class="taken-button">Taget</button>
      <button class="not-taken-button">Ikke taget</button>
    </div>
  </li>

 <li class="reminder" data-medicin-id="2">
    <span class="dot" aria-hidden="true"></span>
    <p class="time">12:00</p>
    <h2>Panodil</h2>

    <div class="checkmark" hidden>✓</div>

    <div class="actions">
      <button class="taken-button">Taget</button>
      <button class="not-taken-button">Ikke taget</button>
    </div>
  </li>

  <li class="reminder" data-medicin-id="3">
    <span class="dot" aria-hidden="true"></span>
    <p class="time">20:00</p>
    <h2>Primcillin</h2>

    <div class="checkmark" hidden>✓</div>

    <div class="actions">
      <button class="taken-button">Taget</button>
      <button class="not-taken-button">Ikke taget</button>
    </div>
  </li>

</ol>
      </section>
          <button id="logoutButton">Log ud</button> <!--til log ud knappen-->

    </main>
      <script src="js/reminder.js"></script>
  </body>
  </html>
