<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <title>Min kalender</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="kalender"> <!--klasse til kalderen-->
        <div class="kalendermåned">
            <h1><strong>Semptember </strong> 2026</h1>
        
            <div class="kalenderpil">
                <button class="pil"></button>
                <button class="i-dag">I dag</button>
                <button class="pil"></button>
            </div>
        </div>

        <div class="dage"> <!--klasse til ugedage-->
            <div>Man</div> <!--giver hver dag sin egen lille kasse, så der komnmer en boks omkring. Kunne have brugt liste-->
            <div>Tir</div>
            <div>Ons</div>
            <div>Tor</div>
            <div>Fre</div>
            <div>Lør</div>
            <div>Søn</div>
        </div>

        <div class="datoer"> <!--klasse til alle kalender datoer. "dato" er en kalender boks. "span" er dato inde i boksen -->
            <div class="dato" 
                <span>31</span> <!--bruger span for senere hen. Da der skal medicin på nogle af dagene-->
            </div>
            <div class="dato"
                <span>1</span> <!--span er en beholder til noget tekst-->
            </div>
            <div class="dato"
                <span>2</span>
            </div>
            <div class="dato"
                <span>3</span>
            </div>
    
            <div class="dato"
                <span>4</span>
            </div>

            <div class="dato"
                <span>5</span>
            </div>
            <div class="dato"
                <span>6</span>
            </div>
        </div>
    </div>
</body>
</html>
