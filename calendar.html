<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <title>Min kalender</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
      <nav>
        <ul>
          <li><a href="reminder.html">Påmindelser</a></li>
        <li><a href="calendar.html">Kalender</a></li>
          <li><a href="medicin-overview.html">Medicinoversigt</a></li>
        </ul>
      </nav>
    </header>
    <div class="kalender"> <!--klasse til kalderen-->
        <div class="kalendermåned">
            <h1 id="måned">Semptember 2026</h1> <!--giver id, så JavaScript kan ændre måneden-->
        
            <div class="kalenderpil">
                <button class="pil" id="forrigeMåned" 
                    type="button" aria-label="Forrige måned"> 
                    &#8592; <!-- kode for en pil til venstre-->
                </button>
                
                <button class="i-dag">
                    I dag
                </button>
            
                <button class="pil" id="næsteMåned" 
                    type="button" aria-label="Næste måned"> 
                    &#8594; <!-- kode for en pil til højre-->
                </button>
            </div>
        </div>

        <div class="dage"> <!--klasse til ugedage-->
            <div>Man</div> <!--giver hver dag sin egen lille kasse, så der komnmer en boks omkring. Kunne have brugt liste-->
            <div>Tir</div>
            <div>Ons</div>
            <div>Tor</div>
            <div>Fre</div>
            <div>Lør</div>
            <div>Søn</div>
        </div>

        <div class="datoer" id="datoer"> <!--klasse til alle kalender datoer. "dato" er en kalender boks. "span" er dato inde i boksen -->
            <!--JavaScript vil fylde denne del med datoer-->
        </div>
    </div>

    <button id="logoutButton">Log ud</button> <!--til log ud knappen-->

    <script src="js/calendar.js"></script>
    
</body>
</html>
